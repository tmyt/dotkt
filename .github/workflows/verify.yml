# CI: the regression harnesses that lock kotlin/clr.
#
# Gate wiring lives in the Makefile, NOT here — this workflow invokes the aggregate shard targets so
# each gate belongs to one canonical group there rather than being copied into this YAML. The targets:
#   make verify-test-corpus : NUnit (+ ILVerify), then schema/sanity over the BIR/CIR it just emitted.
#   make verify-compile-fail: the isolated negative-compilation diagnostic lane.
#   make verify-lowering    : synthetic BIR -> CIR lowering contract tests.
#   make verify-integration : stateful MSBuild, target-universe, C# ABI, and XFAIL-policy gates.
#   make verify-packaged-sdk : the ONLY gate that restores + consumes the 5 real .nupkgs from a feed
#                            (exe / library / cross-module async coroutine / mpp / template scenarios). Two releases
#                            shipped broken on packaging-only defects this gate catches — so it is a DISTINCT,
#                            release-blocking job here, not folded into the big job (GitHub #160).
#
# Jobs:
#   prerequisites (ubuntu)  — build toolchain + CLR stdlib once and upload the exact same-SHA outputs.
#   verify-core/* (ubuntu)  — four independent shards consuming those outputs in parallel.
#   verify        (ubuntu)  — aggregate shard result; preserves the existing required-check name.
#   packaged-sdk  (ubuntu)  — the packaged-nupkg release gate, on its own so a packaging break is
#                             attributed and blocks independently of the functional gates. It consumes the
#                             same-SHA prerequisites, then still repacks and runs its idempotency check itself.
#
# Green semantics: ILVerify / round-trip / packaged-SDK carry explicit XFAIL baselines
# (ILVERIFY_XFAIL / RT_XFAIL / XFAIL_PKG in their test runners) — they exit 0 iff every fail is a
# listed, reasoned expected-fail and every listed entry still fails. NEW failures and stale FIXED entries are red.
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- shared same-SHA build ----------------------------------------------------------------------
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Build once rather than making every shard spend 4-6 minutes reproducing identical outputs.
      # The archive preserves executable bits; extraction in consumers refreshes mtimes because their
      # later checkout timestamps would otherwise make Make rebuild these same-SHA artifacts.
      - name: Build toolchain + CLR stdlib
        run: make toolchain stdlib

      - name: Archive prerequisites
        run: >-
          tar -czf build/ci-prerequisites.tar.gz
          toolchain/kotc/build/install/kotc
          build/ilemit-bin
          build/bir2cir-bin
          build/dll2klib-bin
          build/clr-stdlib-frontend-klib
          build/clr-stdlib
          build/clr-stdlib-rt

      - uses: actions/upload-artifact@v4
        with:
          name: ci-prerequisites
          path: build/ci-prerequisites.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # ---- canonical functional gates, split at independent semantic boundaries ----------------------
  verify_core:
    name: verify-core / ${{ matrix.name }}
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-corpus
            target: verify-test-corpus
          - name: compile-fail
            target: verify-compile-fail
          - name: lowering
            target: verify-lowering
          - name: integration
            target: verify-integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      - uses: actions/download-artifact@v4
        with:
          name: ci-prerequisites
          path: build/ci

      - name: Restore same-SHA prerequisites
        run: tar --touch -xzf build/ci/ci-prerequisites.tar.gz

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  # Keep the historical `verify` required-check name while exposing each shard's own failure.
  verify:
    needs: verify_core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verify-core shard
        env:
          SHARD_RESULT: ${{ needs.verify_core.result }}
        run: |
          echo "verify-core shards: $SHARD_RESULT"
          test "$SHARD_RESULT" = success

  # ---- the packaged-nupkg release gate (Linux), distinct + release-blocking (GitHub #160) ---------
  packaged-sdk:
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      - uses: actions/download-artifact@v4
        with:
          name: ci-prerequisites
          path: build/ci

      - name: Restore same-SHA prerequisites
        run: tar --touch -xzf build/ci/ci-prerequisites.tar.gz

      # Packs the 5 nupkgs fresh from source and drives exe / library / cross-module async coroutine / mpp /
      # template scenarios that resolve them from a local feed only (isolated globalPackagesFolder — no cache
      # masking). Exit 0 iff no fail name is outside the XFAIL_PKG baseline in tests/packaged-sdk/run.sh.
      - name: make verify-packaged-sdk (packaged nupkg resolution)
        run: make verify-packaged-sdk
