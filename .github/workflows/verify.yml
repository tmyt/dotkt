# CI: the three regression harnesses that lock kotlin/clr.
#  - verify-il          : the SHIPPING IL backend (BIR -> ilemit -> CIL) over the full sample corpus + ilverify.
#  - verify-differential: the IL path vs real kotlin/jvm semantics (the C#-independent oracle).
#  - verify-ktproj      : MSBuild/.ktproj end-to-end integration on the IL backend (incl. bidirectional ProjectReference).
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      - name: Build compiler + tools
        run: |
          ./gradlew --no-daemon :kotc:installDist
          dotnet build tools/ilemit   -c Release -o build/ilemit-bin   --nologo
          dotnet build tools/facadegen -c Release -o build/facadegen-bin --nologo
          dotnet build tools/retarget  -c Release -o build/retarget-bin  --nologo
          dotnet build runtime/DotKt.Runtime -c Release -o build/dotkt-runtime --nologo

      # The shipping IL backend (functional + ilverify) — the primary gate.
      - name: verify-il (IL backend + ilverify)
        run: bash scripts/verify-il.sh

      # The C#-independent oracle: IL path must match real Kotlin (kotlin/jvm) semantics.
      - name: verify-differential (IL path vs kotlin/jvm)
        run: bash scripts/verify-differential.sh

      # MSBuild/.ktproj end-to-end on the IL backend (forward + reverse/bidirectional ProjectReference).
      - name: verify-ktproj (IL MSBuild integration)
        run: bash scripts/verify-ktproj.sh

      # Consume a DotKt assembly AS KOTLIN: infix/operator/suspend/top-level restored via DotKt.Metadata attributes.
      - name: verify-roundtrip (Kotlin-modifier round-trip)
        run: bash scripts/verify-roundtrip.sh
