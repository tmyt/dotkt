# CI: the regression harnesses that lock kotlin/clr.
#
# Gate wiring lives in the Makefile, NOT here — this workflow invokes the aggregate targets so the
# canonical gate LIST is single-sourced (adding a gate to `make verify-core` / `make verify` reaches CI
# with no YAML edit). The targets:
#   make verify-core       : the canonical set — verify-il (+ilverify), verify-schema, verify-sanity,
#                            verify-ktproj, verify-roundtrip, verify-differential, verify-widedelegates.
#   make verify-packaged-sdk : the ONLY gate that restores + consumes the 5 real .nupkgs from a feed
#                            (exe / library / mpp packaged projects). Two prior releases shipped broken
#                            on packaging-only defects this gate catches — so it is a DISTINCT,
#                            release-blocking job here, not folded into the big job (GitHub #160).
#
# Jobs:
#   verify        (ubuntu)  — build toolchain + CLR stdlib, then `make verify-core`.
#   packaged-sdk  (ubuntu)  — the packaged-nupkg release gate, on its own so a packaging break is
#                             attributed and blocks independently of the functional gates.
#   windows       (windows) — the Windows story the Linux jobs cannot cover: kotc.bat install, nupkg
#                             restore, a packaged .ktproj build/run, reverse C# interop, `dotnet new`
#                             template creation. WPF/WinUI windowing samples (Windows-only) belong here.
#
# Green semantics: verify-il / verify-roundtrip / verify-packaged-sdk carry explicit XFAIL baselines
# (XFAIL_RUN / XFAIL_ILVERIFY / RT_XFAIL / XFAIL_PKG in the scripts) — they exit 0 iff every fail is a
# listed, reasoned expected-fail and exit 1 on any NEW fail name. A red run is a real regression.
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- the canonical functional gate set (Linux) --------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      # Build the tools + the CLR stdlib (klib + ref + rt) up front so a build failure is attributed
      # HERE, not inside a lazy need_*() call in the first verify script that happens to want it.
      - name: Build toolchain + CLR stdlib
        run: make toolchain stdlib

      # The complete canonical set EXCEPT the packaged-SDK gate (that is the `packaged-sdk` job below).
      # The gate list is single-sourced in the Makefile — see `verify-core`.
      - name: make verify-core (canonical gate set)
        run: make verify-core

  # ---- the packaged-nupkg release gate (Linux), distinct + release-blocking (GitHub #160) ---------
  packaged-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Packs the 5 nupkgs fresh from source and drives exe / library / mpp projects that resolve them
      # from a local feed only (isolated globalPackagesFolder — no cache masking). Exit 0 iff no fail
      # name is outside the XFAIL_PKG baseline in scripts/verify-packaged-sdk.sh.
      - name: make verify-packaged-sdk (packaged nupkg resolution)
        run: make verify-packaged-sdk

  # ---- the Windows story the Linux jobs cannot cover (GitHub #160) --------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-win-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # The canonical scripts are driven through `make`; install it (windows-latest has Git Bash + the
      # core utils the scripts use, but not make).
      - name: Install make
        run: choco install make --no-progress -y

      # kotc.bat install (gradle installDist emits the Windows launcher) + bir2cir/ilemit/facadegen/
      # retarget + the CLR stdlib + the 5 nupkgs — the whole shipping toolchain, on Windows.
      - name: make pack (Windows toolchain + nupkgs)
        run: make pack

      # Package restore + a packaged .ktproj build/RUN, and the library/mpp packaged projects
      # (reverse/bidirectional interop rides the library case). This is the release surface on Windows.
      - name: make verify-packaged-sdk (Windows packaged resolution)
        run: make verify-packaged-sdk

      # MSBuild / .ktproj end-to-end incl. bidirectional C# <ProjectReference> (reverse interop).
      - name: make verify-ktproj (Windows MSBuild integration)
        run: make verify-ktproj

      # `dotnet new` template creation from the freshly-packed feed: install, scaffold, build, run.
      - name: dotnet new template creation
        run: |
          set -euo pipefail
          VER="$(grep -oE '<DotKtVersionPrefix>[^<]+' packaging/DotKt.Versions.props | sed 's/.*>//')"
          SUF="$(grep -oE '<DotKtVersionSuffix>[^<]*' packaging/DotKt.Versions.props | sed 's/.*>//')"
          [ -n "$SUF" ] && VER="$VER-$SUF"
          dotnet new install "DotKt.Templates::$VER" --add-source "$PWD/build/nuget-feed"
          work="$(mktemp -d)"
          dotnet new dotkt-cli -o "$work/hello"
          dotnet build "$work/hello" -c Release
          dotnet run --project "$work/hello" -c Release
