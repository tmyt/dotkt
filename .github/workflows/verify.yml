# CI: the regression harnesses that lock kotlin/clr.
#
# Gate wiring lives in the Makefile, NOT here — this workflow invokes the aggregate targets so the
# canonical gate LIST is single-sourced (adding a gate to `make verify-core` / `make verify` reaches CI
# with no YAML edit). The targets:
#   make verify-core       : NUnit (+ ILVerify), emitted-IR validation, stateful MSBuild, irreducible
#                            round-trip scenarios, and wide-delegate synthesis.
#   make verify-packaged-sdk : the ONLY gate that restores + consumes the 5 real .nupkgs from a feed
#                            (exe / library / cross-module async coroutine / mpp / template scenarios). Two releases
#                            shipped broken on packaging-only defects this gate catches — so it is a DISTINCT,
#                            release-blocking job here, not folded into the big job (GitHub #160).
#
# Jobs:
#   verify        (ubuntu)  — build toolchain + CLR stdlib, then `make verify-core`.
#   packaged-sdk  (ubuntu)  — the packaged-nupkg release gate, on its own so a packaging break is
#                             attributed and blocks independently of the functional gates.
#
# Green semantics: ILVerify / round-trip / packaged-SDK carry explicit XFAIL baselines
# (ILVERIFY_XFAIL / RT_XFAIL / XFAIL_PKG in their test runners) — they exit 0 iff every fail is a
# listed, reasoned expected-fail and every listed entry still fails. NEW failures and stale FIXED entries are red.
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- the canonical functional gate set (Linux) --------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    # 60, not 30: the canonical gate set has outgrown a 2-core hosted runner's 30-minute box —
    # the #86 stack's suite growth pushed verify-core past it (job cancelled at exactly 30:00).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      # Build the tools + the CLR stdlib (klib + ref + rt) up front so a build failure is attributed
      # HERE, not inside a lazy need_*() call in the first verify script that happens to want it.
      - name: Build toolchain + CLR stdlib
        run: make toolchain stdlib

      # The complete canonical set EXCEPT the packaged-SDK gate (that is the `packaged-sdk` job below).
      # The gate list is single-sourced in the Makefile — see `verify-core`.
      - name: make verify-core (canonical gate set)
        run: make verify-core

  # ---- the packaged-nupkg release gate (Linux), distinct + release-blocking (GitHub #160) ---------
  packaged-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install ilverify
        run: dotnet tool install -g dotnet-ilverify

      # Packs the 5 nupkgs fresh from source and drives exe / library / cross-module async coroutine / mpp /
      # template scenarios that resolve them from a local feed only (isolated globalPackagesFolder — no cache
      # masking). Exit 0 iff no fail name is outside the XFAIL_PKG baseline in tests/packaged-sdk/run.sh.
      - name: make verify-packaged-sdk (packaged nupkg resolution)
        run: make verify-packaged-sdk
