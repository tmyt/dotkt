# Build cache to reuse outputs.
org.gradle.caching=true
# Concurrent worktree builds contend on the shared ~/.gradle daemon registry -> transient build
# failures (false-RED gates, esp. verify-ktproj when several agents run installDist at once).
# Disable the daemon: one JVM per invocation (a few extra seconds of startup) buys contention-free
# parallel worktree gates. If contention persists (Kotlin compile daemon), next lever is a
# per-worktree GRADLE_USER_HOME. See MEMORY: never-run-concurrent-gates / the 2026-07-19 incident.
org.gradle.daemon=false
# JVM args for the Gradle daemon; the embedded Kotlin compiler is memory-hungry.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx4g
